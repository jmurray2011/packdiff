name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {os: linux, arch: amd64, suffix: ''}
          - {os: linux, arch: arm64, suffix: ''}
          - {os: darwin, arch: amd64, suffix: ''}
          - {os: darwin, arch: arm64, suffix: ''}
          - {os: windows, arch: amd64, suffix: '.exe'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: true
      - name: Build static binary
        shell: bash
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          mkdir -p build
          version="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" go build -trimpath -ldflags "-s -w -X main.buildVersion=$version" -o "build/packdiff-$TARGET_OS-$TARGET_ARCH$SUFFIX" ./cmd/packdiff
      - name: Probe built linux amd64 binary
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: ./build/packdiff-linux-amd64 --version
      - name: Catalog release binary using embedded Syft library
        shell: bash
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          SUFFIX: ${{ matrix.suffix }}
        run: go run ./internal/release sbom "build/packdiff-$TARGET_OS-$TARGET_ARCH$SUFFIX" "build/packdiff-$TARGET_OS-$TARGET_ARCH$SUFFIX.cdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packdiff-${{ matrix.os }}-${{ matrix.arch }}
          path: build/*
          if-no-files-found: error
  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packdiff-*
          merge-multiple: true
          path: build/release
      - name: Prepare release notes, licensing and checksums
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/release-notes.sh "$GITHUB_REF_NAME" > build/release-notes.md
          go mod download
          go run ./internal/notices -out build/release/THIRD_PARTY_NOTICES \
            build/release/packdiff-linux-amd64 build/release/packdiff-linux-arm64 \
            build/release/packdiff-darwin-amd64 build/release/packdiff-darwin-arm64 \
            build/release/packdiff-windows-amd64.exe
          cp LICENSE NOTICE build/release/
          (cd build/release && sha256sum packdiff-* LICENSE NOTICE THIRD_PARTY_NOTICES > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/release/packdiff-linux-amd64
            build/release/packdiff-linux-arm64
            build/release/packdiff-darwin-amd64
            build/release/packdiff-darwin-arm64
            build/release/packdiff-windows-amd64.exe
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'
      - name: Sign with GitHub OIDC and Rekor
        shell: bash
        run: |
          set -euo pipefail
          for file in build/release/packdiff-*; do
            [[ "$file" == *.cdx.json ]] && continue
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
          cosign sign-blob --yes --bundle build/release/SHA256SUMS.sigstore.json build/release/SHA256SUMS
      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" build/release/* --verify-tag --notes-file build/release-notes.md "${flags[@]}"
